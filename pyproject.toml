[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-code-checker"
version = "2.0.1"
description = "Production-grade, zero-dependency instant bug engine for any codebase."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Krishiv Joshi", email = "krishivjoshi219@gmail.com" }
]
keywords = [
    "linter",
    "static-analysis",
    "bug-detector",
    "ast",
    "security-scanner",
    "autofix",
    "code-quality"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
requires-python = ">=3.10"

[project.scripts]
vcc = "check:main"
check = "check:main"
vibe-code-checker = "check:main"

[project.urls]
Homepage = "https://github.com/krishivjoshi219-collab/Vibe-Code-Checker"
Repository = "https://github.com/krishivjoshi219-collab/Vibe-Code-Checker.git"
Issues = "https://github.com/krishivjoshi219-collab/Vibe-Code-Checker/issues"

[tool.setuptools]
py-modules = ["check"]

[tool.setuptools.packages.find]
include = ["analyzers*", "autofix*", "reporters*"]
exclude = ["fixes*", "repros*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
